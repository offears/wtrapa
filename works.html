<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Onest:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <video class="bg-video" src="prir1.mp4" autoplay muted loop playsinline></video>
  <div class="shade"></div>

  <main class="page">
    <section class="panel wide">
      <h1>works</h1>
      <div id="gallery"><p class="lead">Загрузка…</p></div>
      <a class="back" href="index.html">назад</a>
    </section>
  </main>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script>
    // Настройки: репозиторий и подписи разделов (имя папки -> название)
    const OWNER = 'offears', REPO = 'new-site', BRANCH = 'main';
    const TITLES = { sites: 'Сайты', banners: 'Баннеры', ads: 'Короткие рекламы' };

    const IMG = /\.(jpe?g|png|webp|gif|avif|svg)$/i;
    const VID = /\.(mp4|webm|mov)$/i;
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');

    function say(text) {
      gallery.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'lead';
      p.textContent = text;
      gallery.appendChild(p);
    }

    function thumb(path) {
      const url = encodeURI(path);
      if (VID.test(path)) {
        const v = document.createElement('video');
        v.src = url; v.controls = true; v.preload = 'metadata'; v.playsInline = true;
        v.className = 'thumb';
        return v;
      }
      const img = document.createElement('img');
      img.src = url; img.loading = 'lazy'; img.alt = ''; img.className = 'thumb';
      img.addEventListener('click', () => {
        lightbox.querySelector('img').src = url;
        lightbox.hidden = false;
      });
      return img;
    }

    async function load() {
      try {
        const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();

        // works/<раздел>/<файл>
        const sections = {};
        for (const it of data.tree) {
          if (it.type !== 'blob') continue;
          const m = it.path.match(/^works\/([^/]+)\/([^/]+)$/);
          if (!m || !(IMG.test(m[2]) || VID.test(m[2]))) continue;
          (sections[m[1]] = sections[m[1]] || []).push(it.path);
        }

        const known = Object.keys(TITLES);
        const names = Object.keys(sections).sort((a, b) => {
          const ia = known.indexOf(a) < 0 ? 99 : known.indexOf(a);
          const ib = known.indexOf(b) < 0 ? 99 : known.indexOf(b);
          return ia - ib || a.localeCompare(b);
        });

        if (!names.length) return say('Работы скоро появятся.');

        gallery.innerHTML = '';
        for (const name of names) {
          const block = document.createElement('section');
          block.className = 'section';
          const h = document.createElement('h2');
          h.textContent = TITLES[name] || name.replace(/[_-]+/g, ' ');
          const grid = document.createElement('div');
          grid.className = 'grid';
          sections[name]
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
            .forEach(p => grid.appendChild(thumb(p)));
          block.append(h, grid);
          gallery.appendChild(block);
        }
      } catch (e) {
        say('Не удалось загрузить работы. Обновите страницу чуть позже.');
      }
    }

    lightbox.addEventListener('click', () => { lightbox.hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.hidden = true; });
    load();
  </script>
  <script src="player.js" defer></script>
</body>
</html>
